<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fef0ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fde8e8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e85d5d;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#e85d5d;stop-opacity:0.08" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />
  <!-- Subtle cross pattern -->
  <rect x="340" y="140" width="120" height="170" rx="12" fill="url(#cross)" />
  <rect x="295" y="185" width="210" height="80" rx="12" fill="url(#cross)" />
  <!-- Center icon: cross -->
  <rect x="380" y="160" width="40" height="130" rx="8" fill="#e85d5d" opacity="0.35" />
  <rect x="335" y="195" width="130" height="40" rx="8" fill="#e85d5d" opacity="0.35" />
  <!-- Wordmark -->
  <text x="400" y="340" font-family="Georgia, serif" font-size="22" font-weight="600" fill="#e85d5d" opacity="0.6" text-anchor="middle" letter-spacing="2">4aNurse</text>
</svg>
