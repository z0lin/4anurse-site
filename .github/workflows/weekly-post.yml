name: Weekly blog post

# Writes one post a week from BLOG-BACKLOG.md and commits it straight to main,
# which triggers the normal deploy. There is no review step, so the gates live
# in src/lib/post-gates.mjs (tested by scripts/test-generator.mjs) — read the
# header of scripts/generate-post.mjs before changing anything here.
#
# To PAUSE without editing this file: commit a file named PAUSE-BLOG in the repo
# root. The next run exits cleanly and says so.
#
# Cadence is Tuesday 14:00 UTC — mid-morning US, and a weekday, so a bad post is
# noticed the same day rather than sitting live over a weekend.

on:
  schedule:
    - cron: '0 14 * * 2'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Override the topic (default: next un-done backlog row)'
        required: false
        type: string
      dry_run:
        description: 'Generate and print, but do not commit'
        required: false
        type: boolean
        default: false

# Needs write access to commit the post and the backlog update.
permissions:
  contents: write

concurrency:
  group: weekly-post
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Cheap, no API cost, and it fails the run before spending anything if a
      # gate has been broken by an unrelated change.
      - name: Test the publication gates
        run: node scripts/test-generator.mjs

      - name: Generate the post
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Passed as environment values, never interpolated into the command:
          # a dispatch input reaching a shell string is a command-injection path.
          TOPIC: ${{ inputs.topic }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${TOPIC:-}" ]; then args+=(--topic "$TOPIC"); fi
          if [ "${DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          node scripts/generate-post.mjs "${args[@]}"

      # The generator exits 0 and writes nothing when paused, out of topics, or
      # in dry-run mode, so an empty `path` is a normal weekly result.
      - name: Did it write anything?
        id: check
        run: |
          if [ -z "${{ steps.gen.outputs.path }}" ]; then
            echo "wrote=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No post this week (paused, backlog exhausted, or dry run)."
          else
            echo "wrote=true" >> "$GITHUB_OUTPUT"
          fi

      # The content schema, thin-page threshold and parent-overlap guard all live
      # in the build. This is the last gate before the post is public.
      - name: Verify build
        if: steps.check.outputs.wrote == 'true'
        run: npm run build

      - name: Commit
        if: steps.check.outputs.wrote == 'true'
        env:
          TITLE: ${{ steps.gen.outputs.title }}
          TOPIC_USED: ${{ steps.gen.outputs.topic }}
          WORDS: ${{ steps.gen.outputs.words }}
          PRODUCTS: ${{ steps.gen.outputs.products }}
          COST: ${{ steps.gen.outputs.cost }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Message written to a file rather than inlined: a heredoc nested in a
          # command substitution inside indented YAML does not terminate.
          {
            printf 'content: %s\n\n' "$TITLE"
            printf 'Weekly automated post from BLOG-BACKLOG.md.\n\n'
            printf 'Topic:    %s\n' "$TOPIC_USED"
            printf 'Words:    %s\n' "$WORDS"
            printf 'Products: %s matched by the build-time matcher\n' "$PRODUCTS"
            printf 'Cost:     $%s\n\n' "$COST"
            printf 'Passed the publication gates in src/lib/post-gates.mjs (dedupe\n'
            printf 'against all existing titles, minimum product match, length,\n'
            printf 'structure, no pasted affiliate links) and `npm run build`.\n\n'
            printf 'Generated by scripts/generate-post.mjs.\n'
          } > /tmp/commit-msg.txt

          git add src/content/blog BLOG-BACKLOG.md
          git commit -F /tmp/commit-msg.txt
          git push

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ steps.check.outputs.wrote }}" = "true" ]; then
              echo '### Published'
              echo ''
              echo '**${{ steps.gen.outputs.title }}**'
              echo ''
              echo '- URL: `/blog/${{ steps.gen.outputs.slug }}/`'
              echo '- Topic: ${{ steps.gen.outputs.topic }}'
              echo '- ${{ steps.gen.outputs.words }} words, ${{ steps.gen.outputs.products }} products matched'
              echo '- Cost: $${{ steps.gen.outputs.cost }}'
            else
              echo '### No post this week'
              echo ''
              echo 'Paused, backlog exhausted, or a dry run — see the log above.'
            fi
            echo ''
            echo 'Pause future runs by committing a file named `PAUSE-BLOG` in the repo root.'
          } >> "$GITHUB_STEP_SUMMARY"
